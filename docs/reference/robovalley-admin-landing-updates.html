<style>
/* BEGIN src/app/globals.css */
/* Shared responsive foundations for every page of the app.
   Breakpoints (mobile first: base styles are for phones, then min-width steps up). They are defined once, here and in
   src/lib/breakpoints.ts (the same numbers for scripts). CSS cannot read custom properties inside @media, so a media query writes
   the number itself: (min-width:480px|768px|1024px|1280px), or for "below" (max-width:479.98px|767.98px|1023.98px|1279.98px).
   tests/responsive-foundations.test.ts fails on any other width. */
:root {
  --bp-sm: 480px;  /* large phones */
  --bp-md: 768px;  /* iPad mini and tablets, portrait */
  --bp-lg: 1024px; /* tablets landscape, small laptops: the sidebars are fixed from here */
  --bp-xl: 1280px; /* desktop */
  --page-pad: clamp(16px, 4vw, 40px);
  --h1: clamp(24px, 5vw, 32px);
  --touch: 44px;     /* smallest touch target */
  --touch-gap: 8px;  /* space between touch targets */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --vh: 100vh; /* full height; 100dvh where supported, so iPhone toolbars do not cut the bottom off */
}
@supports (height: 100dvh) {
  :root { --vh: 100dvh; }
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, sans-serif;
}

body {
  padding: 32px;
}

/* Media never makes a page wider than the screen. */
img,
picture,
video,
canvas,
svg,

<script type="text/plain" id="code-axis">// The x-axis settings of the admin charts, in one place, so every chart over days (line or bar) looks the same.

export const AXIS_TICK = { fontSize: 12, fill: "currentColor" } as const;

/** "2026-11-05" -> "11-05": the short label under the axis. The tooltip shows the full date. */
export const shortDay = (day: unknown): string => String(day).slice(5);

/**
 * The x-axis of a chart over days. Recharts drops the labels in between by itself: it keeps the first and the last one and only those
 * others that leave at least `minTickGap` pixels, whatever the number of days (7, 30, 90) and however narrow the card is. Never give
 * a chart over days `interval={0}`: that prints every label, and they run into each other.
 */
export const DAY_AXIS = { tick: AXIS_TICK, tickFormatter: shortDay, interval: "preserveStartEnd", minTickGap: 24 } as const;

/** The x-axis of a chart over names (categories, roles): every name is printed, at an angle. */
export const NAME_AXIS = { tick: AXIS_TICK, interval: 0, angle: -30, textAnchor: "end" } as const;

/** The widest a bar may get, so a few bars do not turn into blocks; with many days a bar simply fills its day. */
export const MAX_BAR = 28;</script>
<script type="text/plain" id="code-css">/* RoboValley site styles (plugin 0.1.12). Loaded on every public page, after Astra's own stylesheet, while RV_CONTRIBUTION_V2 is on.
   Astra's rules for the same elements have the same weight, so being later is enough: no !important. */

/* Space around the entry header. B1 before B2: a page-builder page matches both, and the later one counts. */
.ast-single-post .entry-header.ast-header-without-markup,
.ast-single-post .entry-header.ast-no-title.ast-no-thumbnail {
	margin-bottom: 25px;
	margin-top: 35px;
}
.ast-page-builder-template .entry-header.ast-header-without-markup {
	margin-top: 25px;
	margin-bottom: 15px;
}
/* A page whose title is switched off still has an entry header, with nothing in it: no blank band there. */
.ast-single-post .entry-header.ast-no-title.ast-header-without-markup:not(:has(*)) {
	margin-top: 0;
	margin-bottom: 0;
}

/* The rich-text block. THE one place for it: anything inside an element with the class rv-rt gets this look, whenever it was added.
   Give the class to the container that all fields are rendered into, never to single fields. */
.rv-rt {
	max-width: 880px;
	margin: 24px 0;
	padding: 24px;
	border: 1px solid #e1e4ea;
	border-radius: 16px;
	background: #fff;
	color: #1b1f3b;
	width: 100%;
	box-sizing: border-box;
	overflow-wrap: anywhere;
}
.rv-rt:empty {
	display: none;
}
/* Whatever is put inside shrinks or wraps; the page itself never scrolls sideways. */
.rv-rt *,
.rv-rt *::before,
.rv-rt *::after {
	box-sizing: border-box;
}
.rv-rt > *,
.rv-rt input,
.rv-rt select,
.rv-rt textarea,
.rv-rt fieldset,
.rv-rt img,
.rv-rt svg,
.rv-rt video,
.rv-rt iframe {
	max-width: 100%;
}
.rv-rt fieldset {
	min-width: 0;
}
.rv-rt img,
.rv-rt video {
	height: auto;
}
.rv-rt table {
	display: block;
	width: 100%;
	overflow-x: auto;
}
.rv-rt pre {
	white-space: pre-wrap;
}
.rv-rt > :first-child {
	margin-top: 0;
}
.rv-rt > :last-child {
	margin-bottom: 0;
}</script>

    (pages > 1 ? '<nav class="adm-pager" aria-label="Pages">' + (page > 1 ? '<a data-keep="1" href="' + activityHref(days, ev, page - 1) + '">← Previous</a>' : "<span></span>") + "<span>Page " + page + " of " + pages + "</span>" + (page < pages ? '<a data-keep="1" href="' + activityHref(days, ev, page + 1) + '">Next →</a>' : "<span></span>") + "</nav>" : ""));
  Array.prototype.forEach.call(app.querySelectorAll("button[data-event]"), function (b) {
    b.addEventListener("click", function () { var t = b.getAttribute("data-event"); after = { focus: 'button[data-event="' + t + '"]', scroll: "t" }; location.hash = activityHref(days, t === ev ? "" : t); });
  });
}

/* ---------- 3. moderation, sector counts, sector forms (A3) ---------- */
function moderation(q, rest) {
  var slug = /^\/sector\/([a-z0-9-]+)$/.exec(rest || ""), s = slug && SECTORS.filter(function (x) { return x.slug === slug[1]; })[0];
  if (s) {
    var items = ITEMS.filter(function (i) { return i.s.indexOf(s.slug) >= 0; });
    app.innerHTML = shell("/admin/moderation", '<p class="mod-crumb"><a href="#/admin/moderation">Moderation</a> / ' + esc(s.name) + '</p><div class="adm-head"><h1>Contributors for ' + esc(s.name) + "</h1><p>" + s.total + " contributions from " + s.people + " contributors. Open one to read the full form and review it.</p></div>" +
      (items.length ? '<div class="adm-tablewrap" tabindex="0" role="region" aria-label="Contributions"><table class="adm-table mod-table"><caption class="sr">Contributions</caption><thead><tr><th scope="col">Contribution</th><th scope="col">Contributor</th><th scope="col">Directory categories</th><th scope="col">Submitted</th><th scope="col">Status</th></tr></thead><tbody>' +
      items.map(function (i) { return "<tr><td><strong>" + esc(i.title) + "</strong></td><td>" + esc(i.who) + '<span class="mod-small">' + esc(i.role) + '</span></td><td><span class="mod-pills">' + i.cats.map(function (c) { return '<span class="adm-pill mute">' + esc(c) + "</span>"; }).join("") + '</span></td><td><span class="mod-small">' + i.at + '</span></td><td><span class="adm-pill' + i.tone + '">' + i.st + "</span></td></tr>"; }).join("") + "</tbody></table></div>" : '<div class="adm-note empty" role="status"><div>Nothing here yet.</div></div>'));
    return;
  }
  var sum = function (k) { return SECTORS.reduce(function (n, x) { return n + x[k]; }, 0); };
  var plural = function (n, w) { return n + " " + w + (n === 1 ? "" : "s"); };
  app.innerHTML = shell("/admin/moderation", head("Contributions by Sector", "Open a sector to see every contributor and the forms they filled in. A contribution in several sectors appears under each one.") +
    note("Moderation was a page of its own, with another header, font sizes and colours. It is now at <code>/admin/moderation</code>, in the same shell as Sector Forms and Sector Counts (sidebar, title, cards, tables, buttons). Its sidebar item is marked as the current page. Old addresses lead here: try <a href=\"#/moderation\">#/moderation</a>. Who may open it has not changed (administrators and moderators); a moderator's sidebar shows Moderation only.") +
    '<details class="ref-before"><summary>Before: the old page at /moderation</summary><iframe class="ref-frame" title="The old Moderation page"></iframe></details>' +
    '<div class="adm-grid">' + [["All contributions", "total"], ["Pending review", "pending"], ["Published", "published"], ["Not accepted", "rejected"]].map(function (c) { return '<div class="adm-card stat"><div class="lbl">' + c[0] + '</div><div class="val">' + sum(c[1]) + "</div></div>"; }).join("") + "</div>" +
    '<div class="adm-grid mod-sectors">' + SECTORS.map(function (x) { return '<section class="adm-card mod-sector"><h3>' + esc(x.name) + '</h3><span class="mod-meta">' + plural(x.total, "contribution") + " · " + plural(x.people, "contributor") + '</span><div class="mod-pills"><span class="adm-pill warn">' + x.pending + ' pending</span><span class="adm-pill">' + x.published + ' published</span><span class="adm-pill bad">' + x.rejected + ' not accepted</span></div><a class="btn primary" href="#/admin/moderation/sector/' + x.slug + '">Contributors for ' + esc(x.name) + " →</a></section>"; }).join("") + "</div>");
  app.querySelector("iframe").srcdoc = document.getElementById("old-moderation").content.textContent.replace("</head>", "<style>" + document.getElementById("fonts").textContent + "</style></head>");
}
function sectorCounts() {
  app.innerHTML = shell("/admin/sector-counts", head("Contributions by sector", "How many contributions each sector holds in each state. Shown here to compare the style.") + '<div class="adm-counts">' + table("Contributions per sector", ["Sector", "Pending", "Published", "Rejected", "Total"], SECTORS.map(function (s) { return '<tr><th scope="row">' + esc(s.name) + '</th><td class="num"><a href="#/admin/moderation/sector/' + s.slug + '">' + s.pending + '</a></td><td class="num">' + s.published + '</td><td class="num">' + s.rejected + '</td><td class="num">' + s.total + "</td></tr>"; })) + "</div>");
}
function sectorForms() {
  app.innerHTML = shell("/admin/sector-forms", head("Sector forms", "What the Contribute form asks for in each sector. Shown here to compare the style.") + table("Sectors and their robot types", ["Sector", "On the Contribute form", "Robot types", "Questions on"], SECTORS.map(function (s) { return '<tr><th scope="row">' + esc(s.name) + "</th><td>" + (s.on ? '<span class="adm-pill">Offered</span>' : '<span class="adm-pill mute">Not offered</span>') + "</td><td>" + s.robots + "</td><td>" + s.q + "</td></tr>"; })));
}

/* ---------- 4. the landing page CSS (B1-B3, D) ---------- */
var FIELDS = [["Which robot is it about?", "Milking robots"]];
function stage(body, id) { return '<div class="ref-stage"><div class="' + body + '"><div class="ref-margins" id="' + id + '"><header class="entry-header ast-no-thumbnail ast-header-without-markup rv-c2-has-sector-cta"><h1 class="entry-title">Agriculture &amp; Dairy</h1><div class="rv-c2-sector-cta"><span class="rv-c2-sector-btn">+ Contribute to this sector</span></div></header></div></div><div class="ref-after-content">The page content starts here.</div></div>'; }
function half(which, inner) { return '<div class="ref-half"><span class="ref-tag ' + which + '">' + (which === "after" ? "After: 880px" : "Before: 880px") + '</span><div class="ref-scale"><div class="ref-page' + (which === "before" ? " ref-before-css" : "") + '">' + inner + '</div></div><p class="ref-count" data-measure="1"></p></div>'; }
function block(label, value) { return '<div class="rv-rt"><h3>' + esc(label) + "</h3><p>" + esc(value) + "</p></div>"; }
function fitPages() {
  Array.prototype.forEach.call(app.querySelectorAll(".ref-scale"), function (box) {
    var page = box.firstChild, narrow = window.innerWidth <= 900, w = box.clientWidth, k = narrow ? 1 : Math.min(1, w / 1160);
    page.style.width = narrow ? "100%" : "1160px"; page.style.transform = k === 1 ? "none" : "scale(" + k + ")";
    box.style.height = Math.ceil(page.offsetHeight * k) + "px";
    var rt = page.querySelector(".rv-rt"), out = box.parentNode.querySelector("[data-measure]");
    out.innerHTML = rt ? "Block width on this page: <b>" + rt.offsetWidth + "px</b>" + (k < 1 ? " (a 1160px wide page, shown at " + Math.round(k * 100) + "%)" : "") + ", sideways scroll inside: <b>" + (rt.scrollWidth > rt.clientWidth ? "yes" : "no") + "</b>" : "";
  });
  Array.prototype.forEach.call(app.querySelectorAll(".ref-margins"), function (m) {
    var h = m.querySelector(".entry-header"), cs = getComputedStyle(h); Array.prototype.forEach.call(m.querySelectorAll(".ref-px"), function (x) { x.remove(); });
    [["marginTop", "top"], ["marginBottom", "bottom"]].forEach(function (p) { var b = document.createElement("span"), v = parseFloat(cs[p[0]]); b.className = "ref-px"; b.textContent = cs[p[0]]; b.style[p[1]] = Math.max(0, v / 2 - 9) + "px"; m.appendChild(b); });
  });
}
function landing() {
  var text = block("About this sector", "A rich-text block on a sector page. Its box is 880px wide, before and after; on a narrow screen it is as wide as the screen allows, and nothing inside pushes the page sideways.") ;
  var fields = function () { return FIELDS.map(function (f) { return block(f[0], f[1]); }).join(""); };
  app.innerHTML = '<div class="rv"><div class="adm ref-plain"><main class="ref-land"><h1>Landing page CSS</h1><p>Live previews with the exact stylesheet that ships: rv-contribution-v2/assets/rv-site.css. The striped area is the margin.</p>' +
    note("The entry header has more room (B1, B2), the rich-text block stays 880px wide (B3 was taken back in plugin 0.1.14), and <b>new fields added by admins automatically use .rv-rt at 880px</b> (D): the class is on the container that all fields are put into, not on single fields. The stylesheet loads after Astra's, so it wins without !important.") +
    '<div class="ref-two"><div><h2>B1: single post, 35px above, 25px below</h2>' + stage("ast-single-post", "b1") + '</div><div><h2>B2: page-builder page, 25px above, 15px below</h2>' + stage("ast-single-post ast-page-builder-template", "b2") + "</div></div>" +
    '<h2>B3: the rich-text block</h2><div class="ref-two">' + half("before", text) + half("after", text) + "</div>" + '<p class="ref-count">Width reverted to 880px in 0.1.14; Before and After are now the same.</p>' +
    '<h2>D: an admin adds a new field</h2><p>Type a label and a value. Each field appears as a new .rv-rt block on both sides; no CSS is added for it.</p><form class="ref-form" id="add"><label>Field label<input id="f-label" maxlength="80" required value="Village or district"></label><label>Value<textarea id="f-value" maxlength="2000" required>Guntur district, Andhra Pradesh</textarea></label><button class="btn primary" type="submit">Add field</button><button class="btn" type="button" id="long">Add a very long one</button></form><p class="sr" role="status" id="said"></p>' +
    '<div class="ref-two" id="demo">' + half("before", fields()) + half("after", fields()) + "</div>" +
    '<h2>The CSS that ships</h2><pre class="ref-code">' + esc(code("code-css")) + "</pre></main></div></div>";
  var add = function (label, value) { FIELDS.push([label, value]); Array.prototype.forEach.call(document.querySelectorAll("#demo .ref-page"), function (p) { var d = document.createElement("div"), h = document.createElement("h3"), t = document.createElement("p"); d.className = "rv-rt"; h.textContent = label; t.textContent = value; d.appendChild(h); d.appendChild(t); p.appendChild(d); }); document.getElementById("said").textContent = "Field added: " + label; fitPages(); };
  document.getElementById("add").addEventListener("submit", function (e) { e.preventDefault(); var l = document.getElementById("f-label"), v = document.getElementById("f-value"); add(l.value.trim() || "New field", v.value.trim() || "—"); l.value = ""; v.value = ""; l.focus(); });
  document.getElementById("long").addEventListener("click", function () { add("A very long value", new Array(40).join("longwordwithoutanyspace") + " https://example.com/" + new Array(60).join("path/")); });
  fitPages();
}

/* ---------- routes ---------- */
var after = null, lastPath = null;
function route() {
  var h = location.hash.replace(/^#/, "") || "/admin", i = h.indexOf("?"), path = (i < 0 ? h : h.slice(0, i)).replace(/\/+$/, "") || "/admin", q = new URLSearchParams(i < 0 ? "" : h.slice(i + 1));
  if (path === "/moderation" || path.indexOf("/moderation/") === 0) { location.replace("#/admin" + h); return; } /* old addresses */
  charts = [];
  var sec = "";
  if (path === "/admin" || path === "/admin/dashboard") { sec = "dashboard"; dashboard(q); }
  else if (path === "/admin/login-activity") { sec = "activity"; activity(q); }
  else if (path === "/admin/moderation" || path.indexOf("/admin/moderation/") === 0) { sec = "moderation"; moderation(q, path.slice("/admin/moderation".length)); }
  else if (path === "/admin/sector-counts") { sec = "moderation"; sectorCounts(); }
  else if (path === "/admin/sector-forms") { sec = "moderation"; sectorForms(); }
  else if (path === "/landing-css") { sec = "landing"; landing(); }
  else app.innerHTML = shell(path, head("Not part of this reference", "This page did not change. Use the sections at the top."));
  Array.prototype.forEach.call(document.querySelectorAll(".ref-bar a"), function (a) { if (a.getAttribute("data-sec") === sec) a.setAttribute("aria-current", "true"); else a.removeAttribute("aria-current"); });
  var burger = app.querySelector(".adm-burger");
  if (burger) burger.addEventListener("click", function () { var open = document.getElementById("adm").classList.toggle("open"); burger.setAttribute("aria-expanded", String(open)); });
  if (after) {
    var f = app.querySelector(after.focus), t = document.getElementById(after.scroll); after = null;
    if (f) f.focus({ preventScroll: true });
    if (t) t.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  } else if (path !== lastPath) window.scrollTo(0, 0);
  lastPath = path;
}
window.addEventListener("hashchange", route);
var timer; window.addEventListener("resize", function () { clearTimeout(timer); timer = setTimeout(function () { charts.forEach(function (d) { d(); }); if (app.querySelector(".ref-land")) fitPages(); }, 60); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { charts.forEach(function (d) { d(); }); if (app.querySelector(".ref-land")) fitPages(); });
route();
})();
</script>
</body>
</html>
