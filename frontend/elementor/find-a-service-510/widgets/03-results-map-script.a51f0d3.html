<!-- rv-fas widget 03 PR#33 -->
<div class="rv-fas rv-fas-results" id="rv-fas-results">
	<div class="rv-fas-results-head">
		<p class="rv-fas-summary" id="rv-fas-summary" role="status" aria-live="polite">Choose a service and a place to see results.</p>
	</div>
	<div class="rv-fas-layout">
		<div class="rv-fas-list-col">
			<div class="rv-fas-alert" id="rv-fas-alert" role="alert" hidden></div>
			<div class="rv-fas-state" id="rv-fas-state" hidden></div>
			<ol class="rv-fas-list" id="rv-fas-list" aria-label="Schools"></ol>
		</div>
		<div class="rv-fas-map-col">
			<div class="rv-fas-map" id="rv-fas-map" role="region" aria-label="Map of schools"><p class="rv-fas-map-msg" id="rv-fas-map-msg">Loading map…</p></div>
			<p class="rv-fas-map-note" id="rv-fas-map-note" role="status" hidden></p>
		</div>
	</div>
</div>
<style>
/* Results, map, tooltips and popups. Marker and row highlighting, the "Coming Soon" card and the hover tooltip live here. */
.rv-fas .rv-fas-pin{transition:transform .15s,background .15s}
.rv-fas-pin.is-hover{background:var(--rv-fas-amber);transform:rotate(-45deg) scale(1.25)}
.rv-fas-pin.is-hover>span{color:var(--rv-fas-amber-ink)}
.rv-fas-origin-wrap .rv-fas-origin{transition:box-shadow .15s}
.rv-fas-origin-wrap.is-hover .rv-fas-origin,.rv-fas-origin-wrap:focus .rv-fas-origin{box-shadow:0 0 0 8px rgba(18,63,51,.3)}
.rv-fas-card:focus-visible{outline:3px solid rgba(23,105,79,.45);outline-offset:2px}
.rv-fas-card.is-hover{border-color:var(--rv-fas-brand);box-shadow:var(--rv-fas-shadow)}
.rv-fas .leaflet-marker-icon:focus-visible{outline:3px solid rgba(23,105,79,.55);outline-offset:2px;border-radius:50%}
/* Coming Soon card */
.rv-fas-state.rv-fas-soon{border-style:solid;box-shadow:0 1px 2px rgba(21,48,42,.05)}
.rv-fas-pill{display:inline-block;margin:0 0 10px;padding:4px 12px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--rv-fas-amber-ink);background:var(--rv-fas-amber-bg);border-radius:999px}
/* Tooltip (marker, row): one element, never intercepts the pointer, so it cannot flicker or block a click */
.rv-fas.rv-fas-tip{position:fixed;z-index:100000;box-sizing:border-box;max-width:min(320px,calc(100vw - 16px));padding:10px 12px;font-size:13.5px;line-height:1.4;color:#fff;background:#123f33;border-radius:10px;box-shadow:0 10px 28px rgba(18,63,51,.35);pointer-events:none}
.rv-fas.rv-fas-tip[hidden]{display:none!important}
.rv-fas-tip::after{content:"";position:absolute;top:100%;left:var(--rv-tip-x,50%);margin-left:-6px;border:6px solid transparent;border-top-color:#123f33}
.rv-fas-tip.is-below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:#123f33}
.rv-fas-tip-h{display:block;font-weight:800}
.rv-fas-tip-l{display:block;margin:2px 0 0;color:#e3ede7}
.rv-fas-tip-i{display:block;margin:3px 0 0;overflow-wrap:anywhere}
/* Click popup */
.rv-fas-pop-list{max-height:180px;margin:6px 0;overflow:auto;border:1px solid var(--rv-fas-line);border-radius:10px}
.rv-fas-pop-item{display:block;width:100%;margin:0;padding:7px 10px;font:inherit;font-size:13px;text-align:left;color:var(--rv-fas-brand-dark);background:#fff;border:0;border-bottom:1px solid var(--rv-fas-line);cursor:pointer;overflow-wrap:anywhere}
.rv-fas-pop-item:last-child{border-bottom:0}
.rv-fas-pop-item:hover,.rv-fas-pop-item[aria-current="true"]{background:var(--rv-fas-tint)}
.rv-fas-pop-item:focus-visible{outline:3px solid rgba(23,105,79,.45);outline-offset:-3px}
.rv-fas-pop dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;margin:6px 0 0;font-size:13px}
.rv-fas-pop dt{font-weight:800;color:var(--rv-fas-muted)}
.rv-fas-pop dd{margin:0;overflow-wrap:anywhere}
@media (max-width:640px){.rv-fas-pop-list{max-height:130px}}
/* A phone map is only ~320px tall: inside a popup the list is shorter still, so the heading, the list and the Directions button fit together */
@media (max-width:640px){.rv-fas-popup .rv-fas-pop-list{max-height:96px}}
/* Directions links and the map note */
.rv-fas a.rv-fas-dir-link{display:inline-flex;align-items:center;justify-content:center;min-height:40px;margin:8px 0 0;padding:0 16px;font-size:14px;font-weight:800;line-height:1.2;color:var(--rv-fas-brand);text-decoration:none;background:#fff;border:1.5px solid var(--rv-fas-line-2);border-radius:999px}
.rv-fas a.rv-fas-dir-link:hover{color:var(--rv-fas-brand-dark);background:var(--rv-fas-tint);border-color:var(--rv-fas-brand)}
.rv-fas a.rv-fas-dir-link:focus-visible{outline:3px solid rgba(23,105,79,.45);outline-offset:2px}
.rv-fas-pop-row{padding:6px 0;border-bottom:1px solid var(--rv-fas-line)}
.rv-fas-pop-row:last-child{border-bottom:0}
.rv-fas-pop-row .rv-fas-pop-item{border-bottom:0;padding:4px 10px}
.rv-fas a.rv-fas-dir-link.rv-fas-dir-link--small,.rv-fas-pop-row a.rv-fas-dir-link{min-height:32px;margin:2px 0 0 10px;padding:0 12px;font-size:13px}
.rv-fas-map-note[hidden]{display:none!important}
.rv-fas-map-note{margin:8px 2px 0;font-size:13px;color:var(--rv-fas-amber-ink)}
.rv-fas-map.is-bare{background:#eef2ee}
</style>
<script>
/* RoboValley Find a Service: PIN code + distance search for the chosen category, with the map, tooltips and popups.
   The schools come only from the administrator's uploaded file, through GET /api/services/search?category=&pincode=&radius=
   (never from data in this page). Every piece of uploaded text is inserted with textContent / createElement, never as HTML
   (the Leaflet popup gets a DOM node, not a string). Each school is shown at the centre of its PIN code
   (the file has no building coordinates), so schools of one PIN code share one marker. */
( function () {
	'use strict';
	var LEAFLET = {
		css: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css',
		cssSri: 'sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=',
		js: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js',
		jsSri: 'sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo='
	};
	/* Base map: OpenFreeMap vector tiles drawn with MapLibre GL (through the maplibre-gl-leaflet bridge), with every place label
	   switched to its English name first (name_en, then name:latin, then the local name). Both libraries are pinned and checked
	   with SRI. If WebGL or the style cannot load there is NO second map service: the map keeps working on a plain background
	   (markers, circle, list and Google Maps links are unaffected) and a quiet note says "Map background unavailable". */
	var MAPLIBRE = {
		css: 'https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css',
		cssSri: 'sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V',
		js: 'https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js',
		jsSri: 'sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj',
		bridge: 'https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js',
		bridgeSri: 'sha384-4CB9Vtol9LN6lGgBCvmPLbUEZwilrqIvPieSRurgAXAB7FVJaLS9n8WyAIA5wjQ+'
	};
	var STYLE_URL = 'https://tiles.openfreemap.org/styles/liberty';
	var BARE_NOTE = 'Map background unavailable';
	var GL_TIMEOUT = 15000;
	var GEOCODER = 'https://nominatim.openstreetmap.org/search'; // only called when a PIN code has no stored position, once per Search press
	var DIRECTIONS = 'https://www.google.com/maps/dir/';
	var PLACE = 'https://www.google.com/maps/search/';
	var GEONAMES = ' · Postal code data: <a href="https://www.geonames.org/" target="_blank" rel="noopener noreferrer">GeoNames</a> (CC BY 4.0)';
	var ATTRIBUTION_OFM = '<a href="https://openfreemap.org" target="_blank" rel="noopener noreferrer">OpenFreeMap</a> <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener noreferrer">&copy; OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>' + GEONAMES;
	var PIN_RE = /^[1-9][0-9]{5}$/;
	var TEXT_LIMIT = 50, MAX_KM = 50, INDIA_VIEW = [ 22.5, 79 ], INDIA_ZOOM = 5, TIP_NAMES = 3, CLICK_ZOOM = 14, FIT = { padding: [ 24, 24 ], maxZoom: 15 };

	function start() {
		var $ = function ( id ) { return document.getElementById( id ); };
		var root = $( 'rv-fas-results' ), form = $( 'rv-fas-form' );
		if ( ! root || ! form || root.getAttribute( 'data-ready' ) ) {
			return;
		}
		root.setAttribute( 'data-ready', '1' );
		var el = {
			loc: $( 'rv-fas-location' ), locErr: $( 'rv-fas-loc-err' ), go: $( 'rv-fas-go' ), radius: $( 'rv-fas-radius' ), radiusOut: $( 'rv-fas-radius-out' ),
			summary: $( 'rv-fas-summary' ), alert: $( 'rv-fas-alert' ), state: $( 'rv-fas-state' ), list: $( 'rv-fas-list' ), map: $( 'rv-fas-map' ), mapMsg: $( 'rv-fas-map-msg' ), mapNote: $( 'rv-fas-map-note' )
		};
		var api = ( window.RoboValleyApi && window.RoboValleyApi.base ) || '';
		var reduce = window.matchMedia( '(prefers-reduced-motion: reduce)' );
		var L = null, map = null, layer = null, circle = null, glLayer = null, bareOn = false;
		var S = {
			pin: '', mode: 'pin', selRank: 0, seq: 0, ctl: null, results: [], groups: [], byPin: {}, markers: {}, originMarker: null, lastAsk: 0, searched: false,
			flownPin: '', catName: '', pointer: '', tipKey: '', hoverPin: '', blockedUntil: 0, pending: null, limitTimer: 0, prevSummary: ''
		};
		var radiusTimer, tipTimer;

		function make( tag, cls, text ) {
			var n = document.createElement( tag );
			if ( cls ) {
				n.className = cls;
			}
			if ( text != null ) {
				n.textContent = text;
			}
			return n;
		}
		function clear( n ) {
			while ( n.firstChild ) {
				n.removeChild( n.firstChild );
			}
		}
		function wait( ms ) {
			return new Promise( function ( ok ) { setTimeout( ok, ms ); } );
		}
		function fmtKm( d ) {
			return d <= 0 ? 'Same PIN code' : ( d < 10 ? d.toFixed( 1 ) : Math.round( d ) ) + ' km';
		}
		function plural( n, one, many ) {
			return n + ' ' + ( n === 1 ? one : many );
		}
		function detail( r, re ) {
			var keys = Object.keys( r.details || {} );
			for ( var i = 0; i < keys.length; i++ ) {
				if ( re.test( keys[ i ] ) && r.details[ keys[ i ] ] ) {
					return r.details[ keys[ i ] ];
				}
			}
			return '';
		}

		/* ---------- Category (chosen with the chips in the search panel) ---------- */
		function category() {
			var st = window.RvFasState;
			return st && st.ready ? st.effective : null;
		}
		function categoryParam() {
			var c = category();
			return c && c.slug ? '&category=' + encodeURIComponent( c.slug ) : '';
		}
		function isSoon() {
			var c = category();
			return !! ( c && ! c.active );
		}

		/* ---------- Distance control ---------- */
		function radiusKm() {
			var v = parseInt( el.radius.value, 10 );
			return v >= 1 && v <= MAX_KM ? v : 25;
		}
		function paintRadius() {
			var v = radiusKm();
			el.radiusOut.textContent = v + ' km';
			el.radius.setAttribute( 'aria-valuetext', v + ' km' );
			el.radius.style.setProperty( '--rv-fas-fill', ( ( v - 1 ) / ( MAX_KM - 1 ) * 100 ).toFixed( 2 ) + '%' );
		}
		paintRadius();
		el.radius.addEventListener( 'input', function () {
			paintRadius();
			if ( S.searched && S.pin && S.mode === 'pin' && ! isSoon() ) {
				// The circle follows the slider at once and the view refits to it; the schools are fetched shortly after the last move.
				if ( circle && map ) {
					circle.setRadius( radiusKm() * 1000 );
					map.fitBounds( circle.getBounds(), withAnim( FIT ) );
				}
				clearTimeout( radiusTimer );
				radiusTimer = setTimeout( function () { run( S.pin, false ); }, 250 );
			}
		} );
		function withAnim( o ) {
			return { padding: o.padding, maxZoom: o.maxZoom, animate: ! reduce.matches };
		}

		/* ---------- Form ---------- */
		var LOC_HELP = 'Enter a 6-digit PIN code, district or state';
		function locError( msg ) {
			el.locErr.textContent = msg || '';
			el.locErr.hidden = ! msg;
			if ( msg ) {
				el.loc.setAttribute( 'aria-invalid', 'true' );
			} else {
				el.loc.removeAttribute( 'aria-invalid' );
			}
		}
		/** What the Location box holds: a 6-digit PIN code, some text (a district or a state), or a mistake to explain. */
		function readLocation() {
			var v = el.loc.value.replace( /\s+/g, ' ' ).trim();
			if ( ! v ) {
				return { error: 'Enter a PIN code, district or state.' };
			}
			if ( /^[0-9]+$/.test( v ) ) {
				return PIN_RE.test( v ) ? { place: v } : { error: LOC_HELP };
			}
			return v.length < 2 || ! /\p{L}/u.test( v ) ? { error: LOC_HELP } : { place: v };
		}
		el.loc.addEventListener( 'input', function () {
			locError( '' );
		} );
		form.addEventListener( 'submit', function ( e ) {
			e.preventDefault();
			var st = window.RvFasState, loc = readLocation();
			if ( st && st.ready && st.categories.length && ! st.selected ) { // no silent default: the visitor must choose a service
				locError( loc.error || '' );
				document.dispatchEvent( new CustomEvent( 'rv-fas-need-service' ) );
				return;
			}
			if ( isSoon() ) {
				locError( '' );
				showSoon();
				return;
			}
			locError( loc.error || '' );
			if ( loc.error ) {
				el.loc.focus();
				return;
			}
			run( loc.place, true );
		} );

		/* ---------- Messages and states ---------- */
		function setAlert( msg ) {
			clearLimitTimer(); // any other message replaces the "busy" notice and stops its countdown
			el.alert.textContent = msg || '';
			el.alert.hidden = ! msg;
		}
		/* ---------- Too many searches (HTTP 429): the earlier results stay, nothing is sent until the countdown ends ---------- */
		function clearLimitTimer() {
			if ( S.limitTimer ) {
				clearInterval( S.limitTimer );
				S.limitTimer = 0;
			}
		}
		function limitSeconds() {
			return Math.max( 0, Math.ceil( ( S.blockedUntil - Date.now() ) / 1000 ) );
		}
		/** The notice above the list: the message with the seconds left and a Try again button that wakes up when the wait is over. */
		function paintLimit() {
			var sec = limitSeconds();
			clear( el.alert );
			el.alert.appendChild( make( 'span', 'rv-fas-limit-msg', sec > 0 ? 'Lots of people are searching right now. Please try again in ' + sec + ( sec === 1 ? ' second.' : ' seconds.' ) : 'You can search again now.' ) );
			var b = make( 'button', 'rv-fas-btn rv-fas-btn--ghost rv-fas-btn--small rv-fas-limit-retry', 'Try again' );
			b.type = 'button';
			b.disabled = sec > 0;
			b.addEventListener( 'click', function () {
				var p = S.pending;
				clearLimitTimer();
				if ( p && limitSeconds() === 0 ) {
					run( p.place, p.newPin );
				}
			} );
			el.alert.appendChild( b );
			el.alert.hidden = false;
			if ( sec === 0 ) {
				clearLimitTimer();
			}
		}
		function showLimit() {
			clearLimitTimer();
			paintLimit();
			if ( limitSeconds() > 0 ) {
				S.limitTimer = setInterval( paintLimit, 1000 );
			}
		}
		/** The server said 429: keep what is on screen, put the summary back, and wait. */
		function limitHit( place, newPin, seconds ) {
			S.blockedUntil = Date.now() + Math.max( 1, Math.min( 120, seconds || 30 ) ) * 1000;
			S.pending = { place: place, newPin: newPin };
			el.summary.textContent = S.prevSummary && S.prevSummary !== 'Searching…' ? S.prevSummary : 'Choose a service and a place to see results.';
			if ( S.results.length ) {
				hideState();
			} else {
				showState( 'Find a service near you', [ 'Choose a service, enter a PIN code, district or state, then press Search.' ] );
			}
			showLimit();
		}
		function showState( title, lines, actions, extraClass, pill ) {
			clear( el.state );
			if ( pill ) {
				el.state.appendChild( make( 'span', 'rv-fas-pill', pill ) );
			}
			el.state.appendChild( make( 'h3', null, title ) );
			( lines || [] ).forEach( function ( t ) { el.state.appendChild( make( 'p', null, t ) ); } );
			if ( actions && actions.length ) {
				var row = make( 'div', 'rv-fas-state-actions' );
				actions.forEach( function ( a ) {
					var b = make( 'button', 'rv-fas-btn rv-fas-btn--' + ( a.primary ? 'primary' : 'ghost' ) + ' rv-fas-btn--small', a.label );
					b.type = 'button';
					b.addEventListener( 'click', a.run );
					row.appendChild( b );
				} );
				el.state.appendChild( row );
			}
			el.state.className = 'rv-fas-state' + ( extraClass ? ' ' + extraClass : '' );
			el.state.hidden = false;
		}
		function showLoading() {
			clear( el.state );
			el.state.appendChild( make( 'p', 'rv-fas-state-msg', 'Searching…' ) );
			el.state.appendChild( make( 'div', 'rv-fas-skel' ) );
			el.state.appendChild( make( 'div', 'rv-fas-skel' ) );
			el.state.className = 'rv-fas-state rv-fas-state--loading';
			el.state.hidden = false;
		}
		function hideState() {
			el.state.hidden = true;
			clear( el.state );
		}

		/* ---------- Tooltip (hover, keyboard focus, touch) ---------- */
		var tip = make( 'div', 'rv-fas rv-fas-tip' );
		tip.id = 'rv-fas-tip';
		tip.setAttribute( 'role', 'tooltip' );
		tip.hidden = true;
		document.body.appendChild( tip );

		function tipLine( cls, text ) {
			return make( 'span', cls, text );
		}
		/** One school: name, district, pincode. Several at one point: area line, how many, a numbered list and "+N more". */
		function tipGroup( g ) {
			var box = document.createDocumentFragment();
			var place = [ g.district, g.pin ].filter( Boolean ).join( ', ' );
			if ( g.items.length === 1 ) {
				var r = g.items[ 0 ];
				box.appendChild( tipLine( 'rv-fas-tip-h', r.schoolName ) );
				box.appendChild( tipLine( 'rv-fas-tip-l', [ r.district, r.pincode ].filter( Boolean ).join( ' · ' ) ) );
			} else {
				box.appendChild( tipLine( 'rv-fas-tip-h', place ) );
				box.appendChild( tipLine( 'rv-fas-tip-l', g.items.length + ' ' + ( S.catName || 'labs' ) + ' here' ) );
				g.items.slice( 0, TIP_NAMES ).forEach( function ( r ) {
					box.appendChild( tipLine( 'rv-fas-tip-i', r.rank + '. ' + r.schoolName ) );
				} );
				if ( g.items.length > TIP_NAMES ) {
					box.appendChild( tipLine( 'rv-fas-tip-l', '+' + ( g.items.length - TIP_NAMES ) + ' more' ) );
				}
			}
			if ( g.d > 0 ) {
				box.appendChild( tipLine( 'rv-fas-tip-l', fmtKm( g.d ) + ' away' ) );
			}
			return box;
		}
		/** The searched area: the nearest few, nearest first, each with its distance. */
		function tipNearby() {
			var box = document.createDocumentFragment();
			var first = S.results[ 0 ];
			var where = S.pin + ( first && first.district ? ', ' + first.district : '' );
			box.appendChild( tipLine( 'rv-fas-tip-h', 'Near ' + where ) );
			S.results.slice( 0, TIP_NAMES ).forEach( function ( r ) {
				box.appendChild( tipLine( 'rv-fas-tip-i', r.rank + '. ' + r.schoolName + ' – ' + fmtKm( r.distanceKm ) ) );
			} );
			if ( S.results.length > TIP_NAMES ) {
				box.appendChild( tipLine( 'rv-fas-tip-l', '+' + ( S.results.length - TIP_NAMES ) + ' more' ) );
			}
			return box;
		}
		function showTip( anchor, key, content ) {
			clearTimeout( tipTimer );
			clear( tip );
			tip.appendChild( content );
			tip.hidden = false;
			S.tipKey = key;
			var a = anchor.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
			var vw = document.documentElement.clientWidth, cx = a.left + a.width / 2;
			var left = Math.max( 8, Math.min( cx - w / 2, vw - w - 8 ) );
			var below = a.top - h - 12 < 8; // no room above: put it under the target
			tip.classList.toggle( 'is-below', below );
			tip.style.left = left + 'px';
			tip.style.top = ( below ? a.bottom + 12 : a.top - h - 12 ) + 'px';
			tip.style.setProperty( '--rv-tip-x', Math.max( 14, Math.min( cx - left, w - 14 ) ) + 'px' );
		}
		function hideTip() {
			clearTimeout( tipTimer );
			tip.hidden = true;
			S.tipKey = '';
		}
		function hideTipSoon() {
			clearTimeout( tipTimer );
			tipTimer = setTimeout( hideTip, 90 ); // a short grace, so moving between a marker and its row does not blink
		}
		document.addEventListener( 'pointerdown', function ( e ) {
			S.pointer = e.pointerType || '';
			if ( S.pointer === 'touch' && S.tipKey && ! ( e.target.closest && e.target.closest( '.leaflet-marker-icon, .rv-fas-card' ) ) ) {
				hideTip(); // a tap anywhere else closes the tooltip
			}
		}, true );
		document.addEventListener( 'keydown', function ( e ) {

				timer = setTimeout( bail, GL_TIMEOUT );
				gl.on( 'load', function () { settled = true; clearTimeout( timer ); } );
				gl.on( 'error', function ( e ) { // a single missing tile is normal; a style or source failure before the first draw is not
					if ( ! settled && ! ( e && e.tile ) ) {
						bail();
					}
				} );
			} ).catch( function () {
				showBareMap();
			} );
		}
		var mapReady = loadLeaflet().then( function ( lib ) {
			L = lib;
			el.mapMsg.hidden = true;
			map = L.map( el.map, { scrollWheelZoom: false, minZoom: 4, maxZoom: 19 } );
			map.on( 'focus click', function () { map.scrollWheelZoom.enable(); } );
			map.on( 'blur mouseout', function () { map.scrollWheelZoom.disable(); } );
			map.on( 'movestart zoomstart', hideTip );
			layer = L.layerGroup().addTo( map );
			map.setView( INDIA_VIEW, INDIA_ZOOM );
			addBasemap();
			return true;
		} ).catch( function () {
			el.mapMsg.className = 'rv-fas-map-msg is-error';
			el.mapMsg.textContent = 'The map could not load. The results list still works.';
			el.mapMsg.hidden = false;
			return false;
		} );

		/* ---------- Data ---------- */
		function fetchJson( url, ctl ) {
			return fetch( url, { cache: 'no-store', signal: ctl ? ctl.signal : undefined } ).then( function ( r ) {
				return r.json().catch( function () { return null; } ).then( function ( body ) {
					if ( ! r.ok || ! body || body.success !== true ) {
						var e = new Error( body && body.message ? body.message : 'Search failed' );
						e.status = r.status;
						e.retryAfter = body && body.retryAfter ? Number( body.retryAfter ) : ( r.headers && r.headers.get ? parseInt( r.headers.get( 'Retry-After' ), 10 ) : 0 );
						throw e;
					}
					return body;
				} );
			} );
		}
		/** A 6-digit PIN code searches around its position within the range; any other text is matched against districts and states (the first TEXT_LIMIT, by name, with no distance). */
		function searchUrl( place, km, centre ) {
			var q;
			if ( PIN_RE.test( place ) ) {
				q = 'pincode=' + encodeURIComponent( place ) + '&radius=' + km + categoryParam();
				if ( centre ) {
					q += '&lat=' + centre.lat.toFixed( 6 ) + '&lng=' + centre.lng.toFixed( 6 );
				}
			} else {
				q = 'location=' + encodeURIComponent( place ) + '&pageSize=' + TEXT_LIMIT + categoryParam();
			}
			return api + '/api/services/search?' + q;
		}
		/** OpenStreetMap Nominatim, India only. At most one request per second; null when nothing is found. */
		function geocodePin( pin, ctl ) {
			var gap = Math.max( 0, 1100 - ( Date.now() - S.lastAsk ) );
			return wait( gap ).then( function () {
				S.lastAsk = Date.now();
				return fetch( GEOCODER + '?format=jsonv2&limit=1&countrycodes=in&postalcode=' + encodeURIComponent( pin ), { signal: ctl ? ctl.signal : undefined, headers: { 'Accept-Language': 'en' } } );
			} ).then( function ( r ) {
				return r.ok ? r.json() : null;
			} ).then( function ( list ) {
				var h = list && list[ 0 ], lat = h ? parseFloat( h.lat ) : NaN, lng = h ? parseFloat( h.lon ) : NaN;
				return isFinite( lat ) && isFinite( lng ) && lat > 6 && lat < 38 && lng > 67 && lng < 98 ? { lat: lat, lng: lng } : null;
			} ).catch( function ( e ) {
				if ( e && e.name === 'AbortError' ) {
					throw e;
				}
				return null;
			} );
		}

		/* ---------- Search ---------- */
		/** `place` is a 6-digit PIN code or text (a district or a state). `newPin` true when the visitor pressed Search (fly to the PIN code); false for a range change (refit to the circle). */
		function run( place, newPin ) {
			if ( isSoon() ) { // a category without an upload runs no search
				showSoon();
				return;
			}
			if ( ! api || ! window.fetch ) {
				showState( 'Search is not available', [ 'This page is not connected to the school list. Please try again later.' ] );
				return;
			}
			if ( S.blockedUntil > Date.now() ) { // still waiting after a 429: no request leaves the browser
				S.pending = { place: place, newPin: newPin };
				showLimit();
				return;
			}
			var seq = ++S.seq, km = radiusKm(), isPin = PIN_RE.test( place );
			if ( S.ctl ) {
				S.ctl.abort();
			}
			var ctl = window.AbortController ? new AbortController() : null;
			S.ctl = ctl;
			S.pin = place;
			S.mode = isPin ? 'pin' : 'text';
			el.radius.disabled = ! isPin; // the range only applies around a PIN code
			el.radius.title = isPin ? '' : 'The distance applies to a PIN code search';
			S.searched = true;
			setAlert( '' );
			el.go.disabled = true;
			if ( el.summary.textContent !== 'Searching…' ) {
				S.prevSummary = el.summary.textContent;
			}
			el.summary.textContent = 'Searching…';
			showLoading();
			fetchJson( searchUrl( place, km ), ctl ).then( function ( body ) {
				if ( isPin && body.near && ! body.near.center ) { // no stored position for this PIN code: ask OpenStreetMap, then search again around that point
					return geocodePin( place, ctl ).then( function ( c ) {
						return c ? fetchJson( searchUrl( place, km, c ), ctl ) : body;
					} );
				}
				return body;
			} ).then( function ( body ) {
				if ( seq !== S.seq ) {
					return;
				}
				return mapReady.then( function () {
					if ( seq === S.seq ) {
						show( place, km, body, newPin || S.flownPin !== place );
					}
				} );
			} ).catch( function ( e ) {
				if ( seq !== S.seq || ( e && e.name === 'AbortError' ) ) {
					return;
				}
				if ( e && e.status === 429 ) { // too many searches: keep the earlier results, wait, then let the visitor try again
					limitHit( place, newPin, e.retryAfter );
					return;
				}
				// The map keeps working; nothing stale is left on screen as if it were current.
				setResults( [] );
				drawMap( null, km, [], 'fit' );
				el.summary.textContent = 'The search could not be completed.';
				showState( 'The school search is not available right now', [ e && e.status === 400 && e.message ? e.message : 'Please check your connection and try again.' ], [ { label: 'Try again', run: function () { run( place, true ); } } ] );
			} ).then( function () {
				if ( seq === S.seq ) {
					el.go.disabled = false;
				}
			} );
		}
		function show( place, km, body, flyThere ) {
			var isPin = PIN_RE.test( place );
			var items = body.results || [], centre = body.near && body.near.center;
			S.catName = body.category && body.category.name ? body.category.name : '';
			setResults( items );
			drawMap( centre, km, items, isPin && flyThere ? 'fly' : 'fit' );
			if ( centre ) {
				S.flownPin = place;
			}
			if ( ! body.dataset ) {
				el.summary.textContent = 'No school list yet.';
				showState( 'No data uploaded yet', [ 'Please check back soon.' ] );
				return;
			}
			var total = body.total || 0, shown = items.length;
			if ( ! shown ) {
				el.summary.textContent = 'No schools found.';
				if ( ! isPin ) {
					showState( 'We couldn\u2019t find that place', [ 'Try a PIN code, a district or a state.' ] );
					return;
				}
				var more = km < MAX_KM ? [ { label: 'Search ' + MAX_KM + ' km', run: function () { el.radius.value = String( MAX_KM ); paintRadius(); run( place, false ); } } ] : [];
				showState(
					centre ? ( km < MAX_KM ? 'No schools within ' + km + ' km. Try a larger range.' : 'No schools within ' + km + ' km of this PIN code.' ) : 'We couldn\u2019t find that place',
					centre ? [] : [ 'Check the PIN code and try again.' ],
					centre ? more : []
				);
				return;
			}
			hideState();
			var text = ! isPin ? plural( total, 'school', 'schools' ) + ' in ' + place : centre ? plural( total, 'school', 'schools' ) + ' within ' + km + ' km of ' + place : plural( total, 'school', 'schools' ) + ' in PIN code ' + place;
			if ( total > shown ) {
				text += ' (showing the ' + ( isPin ? 'nearest ' : 'first ' ) + shown + ')';
			}
			el.summary.textContent = text;
			if ( isPin && ! centre ) {
				setAlert( 'We could not find PIN code ' + place + ' on the map, so only the schools in this exact PIN code are listed.' );
			}
		}

		/* ---------- A category without an upload: the Coming Soon card ---------- */
		function pick( slug ) {
			document.dispatchEvent( new CustomEvent( 'rv-fas-select', { detail: { slug: slug } } ) );
		}
		function showSoon() {
			var c = category(), st = window.RvFasState, first = st && st.firstActive;
			S.seq++;
			if ( S.ctl ) {
				S.ctl.abort();
			}
			clearTimeout( radiusTimer );
			el.go.disabled = false;
			setAlert( '' );
			setResults( [] );
			S.flownPin = '';
			if ( map ) {
				drawMap( null, radiusKm(), [], 'fit' );
			}
			el.summary.textContent = 'Coming Soon! ' + c.name + ' is not available yet.';
			var actions = [];
			if ( first ) {
				actions.push( { label: first.name, primary: true, run: function () { pick( first.slug ); } } );
			}
			actions.push( { label: 'Show all services', run: function () { pick( null ); } } );
			showState( c.name, [ 'This service is not listed on RoboValley yet. Meanwhile, you can search:' ], actions, 'rv-fas-soon', 'COMING SOON!' );
		}
		/** Nothing to show yet, or the service was cleared: no search runs and nothing stale stays on screen. */
		function showIdle() {
			S.seq++;
			if ( S.ctl ) {
				S.ctl.abort();
			}
			clearTimeout( radiusTimer );
			el.go.disabled = false;
			setResults( [] );
			if ( map ) {
				drawMap( null, radiusKm(), [], 'fit' );
			}
			el.summary.textContent = 'Choose a service and a place to see results.';
			setAlert( '' );
			showState( 'Find a service near you', [ 'Choose a service, enter a PIN code, district or state, then press Search.' ] );
		}
		function onCategory() {
			var st = window.RvFasState;
			S.catName = category() ? category().name : '';
			if ( st && st.ready && ! st.effective && ! st.error ) { // nothing uploaded in any category yet
				S.seq++;
				setResults( [] );
				el.summary.textContent = 'No data uploaded yet.';
				showState( 'No data uploaded yet', [ 'Please check back soon.' ] );
				return;
			}
			if ( st && st.ready && st.categories.length && ! st.selected ) { // the service was cleared: no silent default
				showIdle();
			} else if ( isSoon() ) {
				showSoon();
			} else if ( S.searched && S.pin ) {
				run( S.pin, false ); // the other category's schools around the same PIN code, no page reload
			} else {
				showIdle();
			}
		}
		document.addEventListener( 'rv-fas-category', onCategory );

		/* Nothing is shown until a PIN code is searched (or the chosen category turns out to be Coming Soon). */
		showState( 'Find a service near you', [ 'Choose a service, enter a PIN code, district or state, then press Search.' ] );
		if ( window.RvFasState && window.RvFasState.ready ) {
			onCategory();
		}
	}

	if ( document.readyState === 'loading' ) {
		document.addEventListener( 'DOMContentLoaded', start );
	} else {
		start();
	}
}() );
</script>
