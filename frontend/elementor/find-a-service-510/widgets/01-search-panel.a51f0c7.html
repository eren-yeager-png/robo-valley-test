		<input class="rv-fas-range" id="rv-fas-radius" type="range" min="1" max="50" step="1" value="25" aria-valuetext="25 km" style="--rv-fas-fill:48.98%">
		<div class="rv-fas-scale" aria-hidden="true"><span>1 km</span><span>25 km</span><span>50 km</span></div>
	</div>
	<div class="rv-fas-submit"><button type="submit" class="rv-fas-btn rv-fas-btn--primary" id="rv-fas-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Search</button></div>
	<div class="rv-fas-cats" id="rv-fas-cats" hidden>
		<span class="rv-fas-cats-label" id="rv-fas-cats-label">Popular services</span>
		<div class="rv-fas-chips" id="rv-fas-chips" role="group" aria-labelledby="rv-fas-cats-label"></div>
	</div>
</form>
</div>
<script>
/* RoboValley Find a Service: the Service combobox, the category chips and the page's shared category state.
   The six services come only from GET /api/services/categories (name, aliases, unique facility count, whether it is sample data; a service with an
   uploaded file is "active"). Nothing is chosen for the visitor: until they pick one (from the list or a chip) there is no service.
   This script publishes the chosen service as window.RvFasState and as a 'rv-fas-category' event; the results map and the directory listen.
   Other widgets ask for a change with a 'rv-fas-select' event: detail {slug} to pick one, {slug:null} to clear, and they can ask for
   the "Choose a service to search" message with a 'rv-fas-need-service' event. Names are only ever set with textContent, never as HTML. */
( function () {
	'use strict';
	var api = ( window.RoboValleyApi && window.RoboValleyApi.base ) || '';
	var st = window.RvFasState = { ready: false, error: false, categories: [], selected: null, effective: null, firstActive: null };
	var paint = function () {};
	/* Words that carry no meaning in a service search ("labs near me" finds the labs). */
	var FILLER = { a: 1, an: 1, the: 1, of: 1, for: 1, and: 1, in: 1, at: 1, to: 1, near: 1, me: 1, my: 1, find: 1, search: 1, service: 1, services: 1 };

	function el( tag, cls, text ) {
		var n = document.createElement( tag );
		if ( cls ) { n.className = cls; }
		if ( text != null ) { n.textContent = text; }
		return n;
	}
	function find( slug ) {
		for ( var i = 0; i < st.categories.length; i++ ) {
			if ( st.categories[ i ].slug === slug ) { return st.categories[ i ]; }
		}
		return null;
	}
	function publish() {
		var first = null;
		st.categories.forEach( function ( c ) { if ( ! first && c.active ) { first = c; } } );
		st.firstActive = first;
		st.effective = ( st.selected && find( st.selected ) ) || first; // the directory below shows the first live service until one is chosen; a search never does
		st.ready = true;
		paint();
		document.dispatchEvent( new CustomEvent( 'rv-fas-category', { detail: st } ) );
	}
	function words( v ) {
		return String( v == null ? '' : v ).toLowerCase().split( /[^\p{L}\p{N}]+/u ).filter( Boolean );
	}
	/** The meaningful words of what the visitor typed: lower case, filler words dropped. */
	function queryWords( v ) {
		return words( v ).filter( function ( w ) { return ! FILLER[ w ]; } );
	}
	/** How well a service matches: null = not at all; else {all, n, score, byName}. A query word matches when a word of the name or of an alias starts with it. */
	function match( c, q ) {
		var nameW = words( c.name ), aliasW = [];
		( c.aliases || [] ).forEach( function ( a ) { aliasW = aliasW.concat( words( a ) ); } );
		var n = 0, score = 0, byName = 0;
		q.forEach( function ( w, i ) {
			var inName = nameW.some( function ( x ) { return x.indexOf( w ) === 0; } );
			if ( inName || aliasW.some( function ( x ) { return x.indexOf( w ) === 0; } ) ) {
				n++;
				score += q.length - i; // earlier words count for more
				if ( inName ) { byName++; }
			}
		} );
		return n ? { all: n === q.length, n: n, score: score, byName: byName } : null;
	}
	/** Matches best first: every word matched, then more words, then the earlier words, then name matches, then the fixed order. */
	function rank( q ) {
		var out = [];
		st.categories.forEach( function ( c, i ) {
			var m = match( c, q );
			if ( m ) { out.push( { c: c, m: m, i: i } ); }
		} );
		out.sort( function ( a, b ) {
			if ( a.m.all !== b.m.all ) { return a.m.all ? -1 : 1; }
			if ( a.m.n !== b.m.n ) { return b.m.n - a.m.n; }
			if ( a.m.score !== b.m.score ) { return b.m.score - a.m.score; }
			if ( a.m.byName !== b.m.byName ) { return b.m.byName - a.m.byName; }
			return a.i - b.i;
		} );
		return out.map( function ( x ) { return x.c; } );
	}
	function count( c ) {
		if ( ! c.active ) { return 'Coming Soon!'; }
		var n = c.count || 0;
		return n.toLocaleString( 'en-IN' ) + ( n === 1 ? ' facility' : ' facilities' ) + ( c.isDemo ? ' · demo' : '' );
	}

	function start() {
		var box = document.getElementById( 'rv-fas-cats' ), chips = document.getElementById( 'rv-fas-chips' );
		if ( ! box || ! chips || box.getAttribute( 'data-ready' ) ) { return; }
		box.setAttribute( 'data-ready', '1' );
		var open = null;

		/* ---------- Service combobox ---------- */
		var input = document.getElementById( 'rv-fas-service' ), list = document.getElementById( 'rv-fas-listbox' ),
			clearBtn = document.getElementById( 'rv-fas-service-clear' ), err = document.getElementById( 'rv-fas-service-err' ),
			live = document.getElementById( 'rv-fas-service-count' ), combo = document.getElementById( 'rv-fas-combo' );
		var opts = [], activeIdx = -1, typing = false, quiet = false;

		function say( msg ) { if ( live ) { live.textContent = msg; } }
		function serviceError( msg ) {
			if ( ! err || ! input ) { return; }
			err.textContent = msg || '';
			err.hidden = ! msg;
			if ( msg ) { input.setAttribute( 'aria-invalid', 'true' ); } else { input.removeAttribute( 'aria-invalid' ); }
		}
		function isOpen() { return !! list && ! list.hidden; }
		function setActive( i ) {
			activeIdx = i;
			opts.forEach( function ( o, k ) {
				o.node.classList.toggle( 'is-active', k === i );
				o.node.setAttribute( 'aria-selected', k === i ? 'true' : 'false' );
			} );
			if ( i >= 0 && opts[ i ] ) {
				input.setAttribute( 'aria-activedescendant', opts[ i ].node.id );
				if ( opts[ i ].node.scrollIntoView ) { opts[ i ].node.scrollIntoView( { block: 'nearest' } ); }
			} else {
				input.removeAttribute( 'aria-activedescendant' );
			}
		}
		function closeList() {
			if ( ! list ) { return; }
			list.hidden = true;
			input.setAttribute( 'aria-expanded', 'false' );
			setActive( -1 );
		}
		/** A name with the typed word prefixes in bold (built from text nodes, never as HTML). */
		function nameNode( name, q ) {
			var span = el( 'span', 'rv-fas-opt-name' ), re = /[\p{L}\p{N}]+|[^\p{L}\p{N}]+/gu, m;
			while ( ( m = re.exec( name ) ) ) {
				var w = m[ 0 ].toLowerCase(), hit = '';
				q.forEach( function ( x ) { if ( w.indexOf( x ) === 0 && x.length > hit.length ) { hit = x; } } );
				if ( hit && /^[\p{L}\p{N}]/u.test( m[ 0 ] ) ) {
					span.appendChild( el( 'strong', null, m[ 0 ].slice( 0, hit.length ) ) );
					if ( m[ 0 ].length > hit.length ) { span.appendChild( document.createTextNode( m[ 0 ].slice( hit.length ) ) ); }
				} else {
					span.appendChild( document.createTextNode( m[ 0 ] ) );
				}
			}
			return span;
		}
		function optNode( id, cls ) {
			var li = el( 'li', 'rv-fas-opt' + ( cls ? ' ' + cls : '' ) );
			li.id = id;
			li.setAttribute( 'role', 'option' );
			li.setAttribute( 'aria-selected', 'false' );
			return li;
		}
		function render() {
			if ( ! list ) { return; }
			var text = input.value, q = typing ? queryWords( text ) : [];
			list.textContent = '';
			opts = [];
			if ( ! st.categories.length ) {
				var wait = optNode( 'rv-fas-opt-wait', 'rv-fas-opt--none' );
				wait.setAttribute( 'aria-disabled', 'true' );
				wait.appendChild( el( 'span', 'rv-fas-opt-name', st.ready ? 'Services are not available right now.' : 'Loading services…' ) );
				list.appendChild( wait );
				say( st.ready ? 'Services are not available right now.' : 'Loading services' );
				return;
			}
			var shown = q.length ? rank( q ) : st.categories.slice(), none = q.length > 0 && ! shown.length;
			function add( c, qq ) {
				var li = optNode( 'rv-fas-opt-' + c.slug, ( c.active ? '' : 'rv-fas-opt--soon' ) + ( st.selected === c.slug ? ' is-chosen' : '' ) );
				li.appendChild( nameNode( c.name, qq ) );
				li.appendChild( el( 'span', 'rv-fas-opt-meta', count( c ) ) );
				var o = { c: c, node: li };
				li.addEventListener( 'click', function () { pickOption( o ); } );
				li.addEventListener( 'pointermove', function () { var k = opts.indexOf( o ); if ( k !== activeIdx ) { setActive( k ); } } );
				opts.push( o );
				list.appendChild( li );
			}
			if ( none ) {
				var nm = optNode( 'rv-fas-opt-none', 'rv-fas-opt--none' );
				nm.setAttribute( 'aria-disabled', 'true' );
				nm.appendChild( el( 'span', 'rv-fas-opt-name', 'No service matches “' + text.trim() + '”' ) );
				list.appendChild( nm );
				var hd = optNode( 'rv-fas-opt-all', 'rv-fas-opt--head' );
				hd.setAttribute( 'aria-disabled', 'true' );
				hd.appendChild( el( 'span', 'rv-fas-opt-name', 'All services' ) );
				list.appendChild( hd );
				st.categories.forEach( function ( c ) { add( c, [] ); } );
				say( 'No service matches ' + text.trim() + '. Showing all ' + st.categories.length + ' services.' );
			} else {
				shown.forEach( function ( c ) { add( c, q ); } );
				say( q.length ? shown.length + ( shown.length === 1 ? ' service matches ' : ' services match ' ) + text.trim() : st.categories.length + ' services available' );
			}
		}
		function openList( keepActive ) {
			if ( ! list ) { return; }
			render();
			list.hidden = false;
			input.setAttribute( 'aria-expanded', 'true' );
			if ( ! keepActive ) { setActive( -1 ); }
		}
		function pickOption( o ) {
			typing = false;
			choose( o.c.slug );
			closeList();
			quiet = true; // putting focus back must not pop the list open again
			input.focus();
			quiet = false;
		}
		function syncInput() {
			if ( ! input || typing ) { return; }
			var c = st.selected && find( st.selected );
			input.value = c ? c.name : '';
			if ( clearBtn ) { clearBtn.hidden = ! input.value; }
		}

		function closeTip() {
			if ( open ) { open.classList.remove( 'is-open' ); open = null; }
		}
		function choose( slug ) {
			var hadX = document.activeElement && document.activeElement.className === 'rv-fas-chip-x';
			st.selected = slug;
			if ( slug ) { serviceError( '' ); }
			publish();
			if ( hadX ) { // the x that had focus is gone: keep keyboard focus on the chip row
				var b = chips.querySelector( '.rv-fas-chip' );
				if ( b ) { b.focus(); }
			}
		}
		paint = function () {
			chips.textContent = '';
			closeTip();
			st.categories.forEach( function ( c ) {
				var wrap = el( 'span', 'rv-fas-chipwrap' );
				var pressed = !! ( st.selected && st.selected === c.slug );
				var b = el( 'button', 'rv-fas-chip' + ( c.active ? '' : ' rv-fas-chip--soon' ), c.name );
				b.type = 'button';
				b.setAttribute( 'aria-pressed', pressed ? 'true' : 'false' );
				b.setAttribute( 'data-slug', c.slug );
				b.addEventListener( 'click', function () {
					typing = false;
					closeList();
					choose( pressed ? null : c.slug );
					if ( ! c.active ) { // touch: the tap shows "Coming Soon!" until the next tap elsewhere (the chips were just redrawn)
						var again = chips.querySelector( '[data-slug="' + c.slug + '"]' ); // slug is from the fixed list, never user text
						if ( again ) {
							open = again.parentNode;
							open.classList.add( 'is-open' );
						}
					}
				} );
				wrap.appendChild( b );
				if ( pressed ) {
					wrap.classList.add( 'has-x' );
					var x = el( 'button', 'rv-fas-chip-x', '×' );
					x.type = 'button';
					x.setAttribute( 'aria-label', 'Clear ' + c.name );
					x.addEventListener( 'click', function () { typing = false; choose( null ); } );
					wrap.appendChild( x );
				}
				if ( ! c.active ) {
					var tip = el( 'span', 'rv-fas-chiptip', 'Coming Soon!' );
					tip.id = 'rv-fas-chiptip-' + c.slug;
					tip.setAttribute( 'role', 'tooltip' );
					b.setAttribute( 'aria-describedby', tip.id );
					wrap.appendChild( tip );
					wrap.addEventListener( 'mouseleave', function () { wrap.classList.remove( 'is-dismissed' ); } );
					wrap.addEventListener( 'focusout', function () { wrap.classList.remove( 'is-dismissed' ); } );
				}
				chips.appendChild( wrap );
			} );
			box.hidden = ! st.categories.length;
			syncInput(); // the text box always shows the service the chips show
			if ( isOpen() ) { render(); }
		};

		if ( input && list ) {
			input.addEventListener( 'input', function () {
				typing = true;
				serviceError( '' );
				if ( st.selected ) { // editing the text drops the chosen service: the box and the chips never disagree
					st.selected = null;
					publish();
				}
				if ( clearBtn ) { clearBtn.hidden = ! input.value; }
				openList( false );
			} );
			input.addEventListener( 'focus', function () { if ( ! quiet && ! isOpen() ) { openList( false ); } } );
			input.addEventListener( 'click', function () { if ( ! isOpen() ) { openList( false ); } } );
			input.addEventListener( 'keydown', function ( e ) {
				var n = opts.length;
				if ( e.key === 'ArrowDown' || e.key === 'ArrowUp' ) {
					e.preventDefault();
					if ( ! isOpen() ) { openList( false ); n = opts.length; }
					if ( n ) { setActive( e.key === 'ArrowDown' ? ( activeIdx + 1 ) % n : ( activeIdx <= 0 ? n - 1 : activeIdx - 1 ) ); }
				} else if ( ( e.key === 'Home' || e.key === 'End' ) && isOpen() && n ) {
					e.preventDefault();
					setActive( e.key === 'Home' ? 0 : n - 1 );
				} else if ( e.key === 'Enter' && isOpen() ) {
					var o = opts[ activeIdx ] || ( queryWords( input.value ).length && opts.length && ! list.querySelector( '.rv-fas-opt--none' ) ? opts[ 0 ] : null );
					if ( o ) { e.preventDefault(); pickOption( o ); } else { closeList(); } // nothing highlighted: Enter just searches
				} else if ( e.key === 'Escape' ) {
					if ( isOpen() ) { e.preventDefault(); closeList(); } else if ( input.value ) { e.preventDefault(); typing = false; input.value = ''; if ( clearBtn ) { clearBtn.hidden = true; } if ( st.selected ) { choose( null ); } }
				} else if ( e.key === 'Tab' ) {
					closeList();
				}
			} );
			list.addEventListener( 'mousedown', function ( e ) { e.preventDefault(); } ); // clicking an option must not blur the box first
			document.addEventListener( 'pointerdown', function ( e ) { if ( isOpen() && combo && ! combo.contains( e.target ) ) { closeList(); } } );
			if ( clearBtn ) {
				clearBtn.addEventListener( 'click', function () {
					typing = false;
					input.value = '';
					clearBtn.hidden = true;
					serviceError( '' );
					if ( st.selected ) { choose( null ); }
					input.focus();
					openList( false );
				} );
			}
			document.addEventListener( 'rv-fas-need-service', function () {
				serviceError( 'Choose a service to search' );
				input.focus();
				openList( false );
			} );
		}

		document.addEventListener( 'rv-fas-select', function ( e ) {
			var slug = e.detail && e.detail.slug;
			typing = false;
			choose( slug && find( slug ) ? slug : null );
		} );
		document.addEventListener( 'pointerdown', function ( e ) { if ( open && ! open.contains( e.target ) ) { closeTip(); } } );
		document.addEventListener( 'keydown', function ( e ) {
			if ( e.key !== 'Escape' ) { return; }
			closeTip();
			Array.prototype.forEach.call( chips.querySelectorAll( '.rv-fas-chipwrap' ), function ( w ) {
				if ( w.matches( ':hover, :focus-within' ) ) { w.classList.add( 'is-dismissed' ); }
			} );
		} );

		function load( first ) {
			if ( ! api || ! window.fetch ) { st.error = true; publish(); return; }
			fetch( api + '/api/services/categories', { cache: 'no-store' } )
				.then( function ( r ) { return r.json().catch( function () { return null; } ).then( function ( d ) { return r.ok && d && d.success ? d : null; } ); } )
				.then( function ( d ) {
					if ( ! d ) { throw new Error( 'categories' ); }
					st.error = false;
					st.categories = d.categories || [];
					if ( st.selected && ! find( st.selected ) ) { st.selected = null; }
					publish();
				} )
				.catch( function () { st.error = true; if ( first ) { publish(); } } ); // without the list the page still works: the API answers with its default service
		}
		document.addEventListener( 'rv-dir-refresh', function () { load( false ); } ); // after an admin publishes a file a service may have become active
		load( true );
	}
	if ( document.readyState === 'loading' ) { document.addEventListener( 'DOMContentLoaded', start ); } else { start(); }
}() );
</script>
