					if ( ! c.active ) { // touch: the tap shows "Coming Soon!" until the next tap elsewhere (the chips were just redrawn)
						var again = chips.querySelector( '[data-slug="' + c.slug + '"]' ); // slug is from the fixed list, never user text
						if ( again ) {
							open = again.parentNode;
							open.classList.add( 'is-open' );
						}
					}
				} );
				wrap.appendChild( b );
				if ( pressed ) {
					wrap.classList.add( 'has-x' );
					var x = el( 'button', 'rv-fas-chip-x', '×' );
					x.type = 'button';
					x.setAttribute( 'aria-label', 'Clear ' + c.name );
					x.addEventListener( 'click', function () { choose( null ); } );
					wrap.appendChild( x );
				}
				if ( ! c.active ) {
					var tip = el( 'span', 'rv-fas-chiptip', 'Coming Soon!' );
					tip.id = 'rv-fas-chiptip-' + c.slug;
					tip.setAttribute( 'role', 'tooltip' );
					b.setAttribute( 'aria-describedby', tip.id );
					wrap.appendChild( tip );
					wrap.addEventListener( 'mouseleave', function () { wrap.classList.remove( 'is-dismissed' ); } );
					wrap.addEventListener( 'focusout', function () { wrap.classList.remove( 'is-dismissed' ); } );
				}
				chips.appendChild( wrap );
			} );
			box.hidden = ! st.categories.length;
		};
		document.addEventListener( 'rv-fas-select', function ( e ) {
			var slug = e.detail && e.detail.slug;
			choose( slug && find( slug ) ? slug : null );
		} );
		document.addEventListener( 'pointerdown', function ( e ) { if ( open && ! open.contains( e.target ) ) { closeTip(); } } );
		document.addEventListener( 'keydown', function ( e ) {
			if ( e.key !== 'Escape' ) { return; }
			closeTip();
			Array.prototype.forEach.call( chips.querySelectorAll( '.rv-fas-chipwrap' ), function ( w ) {
				if ( w.matches( ':hover, :focus-within' ) ) { w.classList.add( 'is-dismissed' ); }
			} );
		} );

		function load( first ) {
			if ( ! api || ! window.fetch ) { st.error = true; publish(); return; }
			fetch( api + '/api/services/categories', { cache: 'no-store' } )
				.then( function ( r ) { return r.json().catch( function () { return null; } ).then( function ( d ) { return r.ok && d && d.success ? d : null; } ); } )
				.then( function ( d ) {
					if ( ! d ) { throw new Error( 'categories' ); }
					st.error = false;
					st.categories = d.categories || [];
					if ( first && ! st.selected ) { st.selected = d.defaultSlug || null; } // start on the first category that has data
					if ( st.selected && ! find( st.selected ) ) { st.selected = null; }
					publish();
				} )
				.catch( function () { st.error = true; if ( first ) { publish(); } } ); // without chips the page still works: the API answers with its default category
		}
		document.addEventListener( 'rv-dir-refresh', function () { load( false ); } ); // after an admin publishes a file a category may have become active
		load( true );
	}
	if ( document.readyState === 'loading' ) { document.addEventListener( 'DOMContentLoaded', start ); } else { start(); }
}() );
</script>
