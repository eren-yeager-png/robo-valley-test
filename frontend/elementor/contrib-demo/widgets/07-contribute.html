		if ( st.step === 3 && ! validateDetails() ) { return; }
		go( st.step + 1 );
	}
	function go( n ) { st.step = n; st.msg = ''; render(); }
	function render() {
		main.textContent = '';
		paintSteps();
		if ( st.done ) { stepDone(); } else if ( st.step === 1 ) { stepScope(); } else if ( st.step === 2 ) { stepType(); } else if ( st.step === 3 ) { stepDetails(); } else { stepPreview(); }
		var hd = document.getElementById( 'rvd-step-h' );
		if ( hd && ( st.step > 1 || st.done || root.getAttribute( 'data-moved' ) ) ) { hd.focus(); }
		root.setAttribute( 'data-moved', '1' );
	}
	paintMine();
	render();
} );
</script>
